name: NPU backend contracts
on:
  push:
    paths:
      - 'docs/NPU*.md'
      - 'src/**'
      - 'tests/**'
      - 'configs/inference/**'
      - 'requirements-npu.txt'
      - '.github/workflows/npu-backend-tests.yml'
  pull_request:
    paths:
      - 'docs/NPU*.md'
      - 'src/**'
      - 'tests/**'
      - 'configs/inference/**'
      - 'requirements-npu.txt'
      - '.github/workflows/npu-backend-tests.yml'
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.14.1 Pillow fastapi uvicorn httpx pydantic python-dotenv ruff==0.14.0 pytest -r requirements-eval.txt
      - name: Lint NPU additions
        run: ruff check src/inference/npu_backend.py src/eval/benchmark.py tests/test_npu_backend.py
      - name: Run contracts and existing regressions
        run: python -m pytest -q tests/test_npu_backend.py tests/check_inference.py tests/check_image_uploads.py tests/test_release.py tests/test_evaluation_workflow.py
